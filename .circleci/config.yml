version: 2.1

jobs:
  B_v4-beta:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: pincer
          command: |
            mkdir -p /tmp/cache
            { set +o pipefail 2>/dev/null; printf "1 10\n2 20\n3 30\n" | awk '{s+=$2}END{print "sum="s}'; true ; } > /tmp/cache/log.gz
            echo "gate v4-beta: $(wc -c </tmp/cache/log.gz) bytes total"
      - persist_to_workspace:
          root: /tmp/cache
          paths:
            - log.gz
  v4-beta:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/cache
      - run:
          name: Read staged file
          command: |
            cat /tmp/cache/log.gz
      - run:
          name: Pull dependencies
          command: git clone --depth 3 -q --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
          command: bunzip2 -c dist.tar.bz2 | tar xf -
      - run:
          no_output_timeout: 66m
          command: /bin/sh -c "./driver"
  checker_tweak-queue:
